<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORM & HALO — Leads</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .dashboard { width: min(1180px, 100%); margin: 0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:28px; }
    .topbar h1 { margin:4px 0 0; }
    .topbar .muted { margin:0; }
    .topbar button { width:auto; min-width:110px; padding:0 20px; margin:0; }
    .panel { background:#fff; border:1px solid #e7e7e4; border-radius:18px; box-shadow:0 18px 60px rgba(0,0,0,.06); overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid #ecece8; }
    .panel-head strong { font-size:15px; }
    .count { color:#777; font-size:13px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th, td { padding:15px 18px; text-align:left; border-bottom:1px solid #eeeeeb; font-size:13px; vertical-align:top; }
    th { background:#fafaf8; color:#777; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#fcfcfa; }
    .name { font-weight:700; color:#171717; }
    .sub { display:block; margin-top:4px; color:#777; font-size:12px; }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:5px 9px; background:#f0f0ed; font-size:11px; font-weight:700; text-transform:capitalize; }
    .interests { display:flex; flex-wrap:wrap; gap:5px; max-width:220px; }
    .interest { padding:4px 7px; border:1px solid #e3e3df; border-radius:999px; color:#555; font-size:11px; }
    .attachment { color:#171717; font-weight:600; }
    .empty, .error { padding:48px 24px; text-align:center; color:#777; }
    .error { color:#a33; }
    @media (max-width:700px) {
      .admin-body { display:block; padding:16px; }
      .topbar { align-items:flex-start; }
      .topbar button { min-width:90px; }
      .panel-head { padding:18px; }
    }
  </style>
</head>
<body class="admin-body">
  <main class="dashboard">
    <header class="topbar">
      <div>
        <div class="brand-mark">FORM &amp; HALO</div>
        <p class="eyebrow" style="margin-top:24px;margin-bottom:6px;">ADMIN PORTAL</p>
        <h1>Leads</h1>
        <p id="welcome" class="muted">Loading your account…</p>
      </div>
      <button id="logout" type="button">Sign out</button>
    </header>

    <section class="panel">
      <div class="panel-head">
        <strong>Project inquiries</strong>
        <span id="count" class="count">Loading…</span>
      </div>
      <div id="content" class="table-wrap">
        <div class="empty">Loading leads…</div>
      </div>
    </section>
  </main>

  <script>
    const content = document.getElementById('content');
    const count = document.getElementById('count');
    const welcome = document.getElementById('welcome');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[char]));
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value.includes('T') ? value : value.replace(' ', 'T') + 'Z');
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    }

    function parseInterests(value) {
      if (!value) return [];
      try { return Array.isArray(value) ? value : JSON.parse(value); }
      catch { return String(value).split(',').map(item => item.trim()).filter(Boolean); }
    }

    async function loadDashboard() {
      try {
        const meResponse = await fetch('/api/admin/me', { credentials:'same-origin', cache:'no-store' });
        const me = await meResponse.json().catch(() => ({}));
        if (!meResponse.ok || !me.authenticated) {
          window.location.replace('/admin/login.html');
          return;
        }

        welcome.textContent = `Welcome, ${me.admin.name}. Role: ${me.admin.role}.`;

        const response = await fetch('/api/admin/leads', { credentials:'same-origin', cache:'no-store' });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not load leads.');

        const leads = data.leads || [];
        count.textContent = `${leads.length} ${leads.length === 1 ? 'lead' : 'leads'}`;

        if (!leads.length) {
          content.innerHTML = '<div class="empty">No project inquiries yet.</div>';
          return;
        }

        content.innerHTML = `
          <table>
            <thead><tr>
              <th>Contact</th><th>Phone</th><th>Interests</th><th>Status</th><th>Date</th><th>File</th>
            </tr></thead>
            <tbody>
              ${leads.map(lead => {
                const interests = parseInterests(lead.interests);
                const fullName = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || 'Unnamed';
                return `<tr>
                  <td><span class="name">${escapeHtml(fullName)}</span><span class="sub">${escapeHtml(lead.email || '—')}</span></td>
                  <td>${escapeHtml(lead.phone || '—')}</td>
                  <td><div class="interests">${interests.length ? interests.map(i => `<span class="interest">${escapeHtml(i)}</span>`).join('') : '<span class="sub">—</span>'}</div></td>
                  <td><span class="badge">${escapeHtml(lead.status || 'new')}</span></td>
                  <td>${escapeHtml(formatDate(lead.created_at))}</td>
                  <td>${lead.file_name ? `<span class="attachment">${escapeHtml(lead.file_name)}</span>` : '<span class="sub">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`;
      } catch (error) {
        count.textContent = 'Error';
        content.innerHTML = `<div class="error">${escapeHtml(error.message || 'Could not load leads.')}</div>`;
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method:'POST', credentials:'same-origin' });
      window.location.replace('/admin/login.html');
    });

    loadDashboard();
  </script>
</body>
</html>
