<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORM & HALO — Leads</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .dashboard { width: min(1180px, 100%); margin: 0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:28px; }
    .topbar h1 { margin:4px 0 0; }
    .topbar .muted { margin:0; }
    .topbar button { width:auto; min-width:110px; padding:0 20px; margin:0; }
    .panel { background:#fff; border:1px solid #e7e7e4; border-radius:18px; box-shadow:0 18px 60px rgba(0,0,0,.06); overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid #ecece8; }
    .panel-head strong { font-size:15px; }
    .count { color:#777; font-size:13px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th, td { padding:15px 18px; text-align:left; border-bottom:1px solid #eeeeeb; font-size:13px; vertical-align:top; }
    th { background:#fafaf8; color:#777; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr { cursor:pointer; transition:background .15s ease; }
    tbody tr:hover { background:#f8f8f5; }
    .name { font-weight:700; color:#171717; }
    .sub { display:block; margin-top:4px; color:#777; font-size:12px; }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:5px 9px; background:#f0f0ed; font-size:11px; font-weight:700; text-transform:capitalize; }
    .interests { display:flex; flex-wrap:wrap; gap:5px; max-width:220px; }
    .interest { padding:4px 7px; border:1px solid #e3e3df; border-radius:999px; color:#555; font-size:11px; }
    .attachment { color:#171717; font-weight:600; }
    .empty, .error { padding:48px 24px; text-align:center; color:#777; }
    .error { color:#a33; }

    .modal-backdrop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(20,20,18,.48); z-index:1000; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(680px,100%); max-height:min(760px,90vh); overflow:auto; background:#fff; border:1px solid #e7e7e4; border-radius:20px; box-shadow:0 30px 90px rgba(0,0,0,.22); }
    .modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding:24px 26px 18px; border-bottom:1px solid #ecece8; }
    .modal-head h2 { margin:4px 0 0; font-size:25px; letter-spacing:-.03em; }
    .close { width:36px !important; min-width:36px !important; height:36px !important; margin:0 !important; padding:0 !important; border:1px solid #ddd !important; border-radius:50% !important; background:#fff !important; color:#171717 !important; font-size:20px !important; line-height:1 !important; }
    .modal-body { padding:24px 26px 28px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 24px; }
    .detail { min-width:0; }
    .detail.full { grid-column:1 / -1; }
    .detail-label { margin-bottom:6px; color:#777; font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
    .detail-value { color:#171717; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
    .detail-value.muted-value { color:#777; }
    .modal-interests { display:flex; flex-wrap:wrap; gap:6px; }
    .modal-file { margin-top:22px; padding:15px 16px; border:1px solid #e5e5e1; border-radius:12px; background:#fafaf8; }
    .modal-file-name { font-size:13px; font-weight:600; overflow-wrap:anywhere; }
    .secure-note { margin-top:5px; color:#777; font-size:11px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
    .modal-actions button { width:auto; min-width:100px; padding:0 18px; margin:0; }
    .modal-actions .secondary { background:#fff; color:#171717; border:1px solid #d8d8d4; }
    @media (max-width:700px) {
      .admin-body { display:block; padding:16px; }
      .topbar { align-items:flex-start; }
      .topbar button { min-width:90px; }
      .panel-head { padding:18px; }
      .modal-backdrop { padding:12px; }
      .modal-head, .modal-body { padding-left:20px; padding-right:20px; }
      .detail-grid { grid-template-columns:1fr; }
      .detail.full { grid-column:auto; }
    }
  </style>
</head>
<body class="admin-body">
  <main class="dashboard">
    <header class="topbar">
      <div>
        <div class="brand-mark">FORM &amp; HALO</div>
        <p class="eyebrow" style="margin-top:24px;margin-bottom:6px;">ADMIN PORTAL</p>
        <h1>Leads</h1>
        <p id="welcome" class="muted">Loading your account…</p>
      </div>
      <button id="logout" type="button">Sign out</button>
    </header>

    <section class="panel">
      <div class="panel-head">
        <strong>Project inquiries</strong>
        <span id="count" class="count">Loading…</span>
      </div>
      <div id="content" class="table-wrap">
        <div class="empty">Loading leads…</div>
      </div>
    </section>
  </main>

  <div id="leadModal" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div>
          <div class="brand-mark">PROJECT INQUIRY</div>
          <h2 id="modalTitle">Lead details</h2>
        </div>
        <button id="closeModal" class="close" type="button" aria-label="Close">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <script>
    const content = document.getElementById('content');
    const count = document.getElementById('count');
    const welcome = document.getElementById('welcome');
    const leadModal = document.getElementById('leadModal');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');

    let leads = [];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[char]));
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value.includes('T') ? value : value.replace(' ', 'T') + 'Z');
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    }

    function parseInterests(value) {
      if (!value) return [];
      try { return Array.isArray(value) ? value : JSON.parse(value); }
      catch { return String(value).split(',').map(item => item.trim()).filter(Boolean); }
    }

    function parseDetails(value) {
      if (!value) return 'No project details provided.';
      return String(value);
    }

    function openLead(lead) {
      const interests = parseInterests(lead.interests);
      const fullName = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || 'Unnamed';
      modalTitle.textContent = fullName;

      modalBody.innerHTML = `
        <div class="detail-grid">
          <div class="detail">
            <div class="detail-label">Email</div>
            <div class="detail-value">${escapeHtml(lead.email || '—')}</div>
          </div>
          <div class="detail">
            <div class="detail-label">Phone</div>
            <div class="detail-value">${escapeHtml(lead.phone || '—')}</div>
          </div>
          <div class="detail">
            <div class="detail-label">ZIP code</div>
            <div class="detail-value">${escapeHtml(lead.zip || '—')}</div>
          </div>
          <div class="detail">
            <div class="detail-label">Country</div>
            <div class="detail-value">${escapeHtml(lead.country || '—')}</div>
          </div>
          <div class="detail">
            <div class="detail-label">Status</div>
            <div class="detail-value"><span class="badge">${escapeHtml(lead.status || 'new')}</span></div>
          </div>
          <div class="detail">
            <div class="detail-label">Submitted</div>
            <div class="detail-value">${escapeHtml(formatDate(lead.created_at))}</div>
          </div>
          <div class="detail full">
            <div class="detail-label">Interests</div>
            <div class="detail-value">
              <div class="modal-interests">${interests.length ? interests.map(i => `<span class="interest">${escapeHtml(i)}</span>`).join('') : '<span class="muted-value">None selected</span>'}</div>
            </div>
          </div>
          <div class="detail full">
            <div class="detail-label">Project details</div>
            <div class="detail-value">${escapeHtml(parseDetails(lead.project_details))}</div>
          </div>
        </div>
        ${lead.file_name ? `
          <div class="modal-file">
            <div class="detail-label">Attachment</div>
            <div class="modal-file-name">${escapeHtml(lead.file_name)}</div>
            <div class="secure-note">Stored securely in project storage. Secure file access will be enabled next.</div>
          </div>` : ''}
        <div class="modal-actions">
          <button id="modalCloseAction" class="secondary" type="button">Close</button>
        </div>
      `;

      leadModal.classList.add('open');
      leadModal.setAttribute('aria-hidden', 'false');
      document.getElementById('modalCloseAction').addEventListener('click', closeLead);
    }

    function closeLead() {
      leadModal.classList.remove('open');
      leadModal.setAttribute('aria-hidden', 'true');
    }

    async function loadDashboard() {
      try {
        const meResponse = await fetch('/api/admin/me', { credentials:'same-origin', cache:'no-store' });
        const me = await meResponse.json().catch(() => ({}));
        if (!meResponse.ok || !me.authenticated) {
          window.location.replace('/admin/login.html');
          return;
        }

        welcome.textContent = `Welcome, ${me.admin.name}. Role: ${me.admin.role}.`;

        const response = await fetch('/api/admin/leads', { credentials:'same-origin', cache:'no-store' });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not load leads.');

        leads = data.leads || [];
        count.textContent = `${leads.length} ${leads.length === 1 ? 'lead' : 'leads'}`;

        if (!leads.length) {
          content.innerHTML = '<div class="empty">No project inquiries yet.</div>';
          return;
        }

        content.innerHTML = `
          <table>
            <thead><tr>
              <th>Contact</th><th>Phone</th><th>Interests</th><th>Status</th><th>Date</th><th>File</th>
            </tr></thead>
            <tbody>
              ${leads.map((lead, index) => {
                const interests = parseInterests(lead.interests);
                const fullName = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || 'Unnamed';
                return `<tr data-lead-index="${index}">
                  <td><span class="name">${escapeHtml(fullName)}</span><span class="sub">${escapeHtml(lead.email || '—')}</span></td>
                  <td>${escapeHtml(lead.phone || '—')}</td>
                  <td><div class="interests">${interests.length ? interests.map(i => `<span class="interest">${escapeHtml(i)}</span>`).join('') : '<span class="sub">—</span>'}</div></td>
                  <td><span class="badge">${escapeHtml(lead.status || 'new')}</span></td>
                  <td>${escapeHtml(formatDate(lead.created_at))}</td>
                  <td>${lead.file_name ? `<span class="attachment">${escapeHtml(lead.file_name)}</span>` : '<span class="sub">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`;

        content.querySelectorAll('tbody tr[data-lead-index]').forEach(row => {
          row.addEventListener('click', () => openLead(leads[Number(row.dataset.leadIndex)]));
        });
      } catch (error) {
        count.textContent = 'Error';
        content.innerHTML = `<div class="error">${escapeHtml(error.message || 'Could not load leads.')}</div>`;
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method:'POST', credentials:'same-origin' });
      window.location.replace('/admin/login.html');
    });

    document.getElementById('closeModal').addEventListener('click', closeLead);
    leadModal.addEventListener('click', event => {
      if (event.target === leadModal) closeLead();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && leadModal.classList.contains('open')) closeLead();
    });

    loadDashboard();
  </script>
</body>
</html>
