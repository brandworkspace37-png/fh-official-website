<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORM & HALO — Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-body">
  <main class="auth-card">
    <div class="brand-mark">FORM &amp; HALO</div>
    <p class="eyebrow">ADMIN PORTAL</p>
    <h1>Sign in</h1>
    <p class="muted">Enter your authorized admin email to receive a verification code.</p>

    <form id="email-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button type="submit">Send code</button>
    </form>

    <form id="code-form" class="hidden" novalidate>
      <label for="code">Verification code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      <button type="submit">Verify &amp; continue</button>
      <button id="back-button" class="secondary" type="button">Use another email</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/admin/login.js" defer></script>
</body>
</html>
