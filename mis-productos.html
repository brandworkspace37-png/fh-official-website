<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mis productos | Form & Halo</title><link rel="stylesheet" href="css/style.css"><style>.my-page{min-height:100vh;padding:150px 24px 110px}.my-wrap{width:min(1100px,100%);margin:auto}.my-head{margin-bottom:65px}.my-head h1{font-size:clamp(50px,8vw,96px);line-height:.94;letter-spacing:-.05em;font-weight:500}.my-head h1 span{display:block;color:var(--color-gray)}.my-head p{max-width:560px;color:var(--color-gray);font-size:14px;line-height:1.7;margin-top:22px}.orders{border-top:1px solid rgba(255,255,255,.13)}.order-card{padding:28px 0;border-bottom:1px solid rgba(255,255,255,.13)}.order-top{display:flex;justify-content:space-between;gap:25px;align-items:flex-start}.order-id{font-size:9px;letter-spacing:.16em;color:var(--color-gray)}.order-date{font-size:10px;color:var(--color-gray);margin-top:8px}.order-status{padding:8px 11px;border:1px solid rgba(255,255,255,.25);font-size:9px;letter-spacing:.12em}.my-product{display:flex;justify-content:space-between;gap:30px;margin-top:25px}.my-product h2{font-size:21px;font-weight:500;margin:0 0 8px}.my-product p{font-size:11px;color:var(--color-gray);line-height:1.7;margin:0}.my-price{font-size:18px}.tracking{margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:20px}.tracking span{font-size:9px;letter-spacing:.15em;color:var(--color-gray)}.tracking strong{font-size:11px;font-weight:500}.empty{padding:70px 0;color:var(--color-gray);border-bottom:1px solid rgba(255,255,255,.13)}.empty h2{color:#fff;font-size:28px;font-weight:500;margin:0 0 12px}.my-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.my-button{padding:13px 18px;border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.my-button:hover{background:#fff;color:#000}.portal-links{margin-top:65px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.portal-link{padding:24px 20px;border-top:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.portal-link:hover{color:var(--color-gray)}@media(max-width:650px){.my-page{padding:115px 20px 80px}.order-top,.my-product,.tracking{flex-direction:column;align-items:flex-start}.portal-links{grid-template-columns:1fr}.my-actions{flex-direction:column}.my-button{text-align:center}}</style></head><body><header><nav><div class="nav-links"><a href="index.html#transformacion">Transformación</a><a href="index.html#servicios">Servicios</a><a href="index.html#proceso">Proceso</a><a href="index.html#contacto">Contacto</a></div><a class="logo" href="index.html">FORM &amp; HALO</a><a class="cart-nav" href="carrito.html">🛒</a></nav></header><main class="my-page"><div class="my-wrap"><div class="my-head"><span class="section-eyebrow">PORTAL DEL CLIENTE</span><h1>Mis <span>productos.</span></h1><p>Aquí podrás consultar tus pedidos, conocer su estado y encontrar la información relacionada con cada producto.</p></div><section class="orders" id="orders"></section><div class="portal-links"><a class="portal-link" href="#">Seguimiento</a><a class="portal-link" href="#">Recibos</a><a class="portal-link" href="#">Devoluciones y soporte</a></div></div></main><script>const orders=JSON.parse(localStorage.getItem('fhOrders')||'[]'),container=document.getElementById('orders');if(!orders.length){container.innerHTML='<div class="empty"><h2>Aún no tienes productos.</h2><p>Cuando realices un pedido, aparecerá aquí.</p><div class="my-actions"><a class="my-button" href="index.html#producto">Explorar productos</a></div></div>'}else{container.innerHTML=orders.map(order=>{const date=new Date(order.createdAt).toLocaleDateString('es-US',{year:'numeric',month:'long',day:'numeric'});return `<article class="order-card"><div class="order-top"><div><div class="order-id">PEDIDO ${order.number}</div><div class="order-date">${date}</div></div><span class="order-status">${order.status}</span></div>${order.items.map(item=>`<div class="my-product"><div><h2>${item.product}</h2><p>${item.size} · ${item.dimensions||''}<br>Cantidad: ${item.quantity}</p></div><strong class="my-price">$${((Number(item.price)||0)*item.quantity).toLocaleString('en-US')}</strong></div>`).join('')}<div class="tracking"><span>TRACKING NUMBER</span><strong>${order.tracking||'Se asignará cuando el pedido sea enviado'}</strong></div><div class="my-actions"><a class="my-button" href="pedido-confirmado.html">Ver pedido</a></div></article>`}).join('')}</script></body></html>
