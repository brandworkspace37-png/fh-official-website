<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORM & HALO — Tracking</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f3ef;color:#171717;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(720px,calc(100% - 32px));margin:0 auto;padding:42px 0 60px}.brand{font-size:11px;font-weight:800;letter-spacing:.18em}.card{margin-top:22px;background:#fff;border:1px solid #e5e3dd;border-radius:20px;box-shadow:0 18px 60px rgba(23,23,23,.06);overflow:hidden}.head{padding:24px;border-bottom:1px solid #e5e3dd}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.16em;color:#77756f;text-transform:uppercase}.head h1{margin:8px 0 4px;font-size:28px;letter-spacing:-.04em}.muted{color:#77756f;font-size:12px}.body{padding:24px}.status{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eee8da;color:#806a3d;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.status.shipped{background:#e8eef6;color:#46607d}.status.delivered{background:#e2f1e8;color:#2e6949}.timeline{display:grid;gap:0;margin:24px 0}.step{display:grid;grid-template-columns:18px 1fr;gap:12px;min-height:56px}.dot{width:12px;height:12px;margin-top:3px;border-radius:50%;background:#d8d5ce;border:2px solid #f4f3ef}.step.done .dot{background:#4f735d}.step.current .dot{background:#b49a67}.step strong{display:block;font-size:12px}.step span{display:block;margin-top:3px;color:#77756f;font-size:10px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{padding:14px;border:1px solid #e5e3dd;border-radius:12px}.box small{display:block;color:#77756f;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.box b{display:block;margin-top:6px;font-size:12px;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions a{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;background:#171717;color:#fff;text-decoration:none;font-size:11px;font-weight:750}.actions a.secondary{background:#fff;color:#171717;border:1px solid #e5e3dd}.error{text-align:center;padding:55px 20px;color:#9a4e4e;font-size:13px}@media(max-width:560px){.meta,.actions{grid-template-columns:1fr}.head h1{font-size:24px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">FORM & HALO</div>
    <section id="app" class="card"><div class="error">Cargando información del envío…</div></section>
  </main>
<script>
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);const token=params.get('token')||'';
const labels={label_created:'Preparando envío',in_transit:'En camino',out_for_delivery:'En reparto',delivered:'Entregado',delayed:'Retrasado',exception:'Incidencia',returned:'Devuelto'};
function fmt(v){if(!v)return'—';const d=new Date(String(v).includes('T')?v:String(v).replace(' ','T')+'Z');return isNaN(d)?v:d.toLocaleDateString('es-US',{year:'numeric',month:'long',day:'numeric'});}
async function load(){if(!token){$('#app').innerHTML='<div class="error">Este enlace de seguimiento no es válido.</div>';return}try{const r=await fetch('/api/tracking?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo cargar el envío.');render(d)}catch(e){$('#app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function $(s){return document.querySelector(s)}
function render(d){const s=d.shipment||{},o=d.order||{},current=s.status||'label_created';const steps=['label_created','in_transit','out_for_delivery','delivered'],idx=steps.indexOf(current);$('#app').innerHTML=`<div class="head"><div class="eyebrow">SEGUIMIENTO DE PEDIDO</div><h1>${esc(o.order_number||'FORM & HALO')}</h1><div class="muted">${esc([o.first_name,o.last_name].filter(Boolean).join(' ')||'Cliente')}</div></div><div class="body"><span class="status ${current}">${esc(labels[current]||current)}</span><div class="timeline">${steps.map((x,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}"><i class="dot"></i><div><strong>${esc(labels[x])}</strong><span>${i===idx?'Estado actual':''}</span></div></div>`).join('')}</div><div class="meta"><div class="box"><small>Transportista</small><b>${esc(s.carrier||'—')}</b></div><div class="box"><small>Tracking</small><b>${esc(s.tracking_number||'—')}</b></div><div class="box"><small>Enviado</small><b>${esc(fmt(s.shipped_at))}</b></div><div class="box"><small>Entrega estimada</small><b>${esc(fmt(s.estimated_delivery_at))}</b></div></div><div class="actions"><a href="mailto:brandworkspace37@gmail.com?subject=Soporte%20pedido%20${encodeURIComponent(o.order_number||'')}">Contactar soporte</a><a class="secondary" href="/faq.html">Preguntas frecuentes</a></div></div>`}
load();
</script>
</body>
</html>
